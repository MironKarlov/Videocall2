<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер - смотреть друга</title>
    <style>
        body { font-family: system-ui; background: #0a0a0a; color: white; padding: 20px; text-align: center; }
        button { background: #3b82f6; padding: 15px 30px; font-size: 18px; border: none; border-radius: 50px; color: white; margin: 10px; width: 90%; }
        input { padding: 15px; font-size: 16px; border-radius: 50px; border: none; width: 90%; margin: 10px 0; text-align: center; background: #1a1a1a; color: white; }
        video { width: 100%; border-radius: 20px; margin-top: 10px; background: #111; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 20px; margin: 15px 0; }
        .status { padding: 15px; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<h2>🎬 ПЛЕЕР — СМОТРЕТЬ ДРУГА</h2>

<div class="box">
    <p>🔢 <strong>НОМЕР КОМНАТЫ (которую создал хост)</strong></p>
    <input type="text" id="roomNumber" placeholder="Например: 123">
    <button id="connectBtn">🔗 ПОДКЛЮЧИТЬСЯ</button>
</div>

<div id="videoArea" style="display:none">
    <div class="box">
        <p>👤 <strong>ВИДЕО ДРУГА</strong></p>
        <video id="remoteVideo" autoplay playsinline></video>
        <button id="stopBtn" style="background:#dc2626">⏹️ ОТКЛЮЧИТЬСЯ</button>
    </div>
</div>

<div id="status" class="status" style="background:#333"></div>

<script>
    let pc = null;
    let ws = null;
    let room = null;

    function status(msg, color = '#ffaa00') {
        const div = document.getElementById('status');
        div.innerHTML = msg;
        div.style.background = color;
    }

    document.getElementById('connectBtn').onclick = () => {
        room = document.getElementById('roomNumber').value.trim();
        if (!room) {
            status('❌ Введите номер комнаты', '#8b0000');
            return;
        }

        status('🔍 Ищем комнату ' + room + '...', '#ffaa00');

        ws = new WebSocket('wss://webrtc-signaling-server-1.onrender.com');
        
        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'viewer', room: room }));
        };

        ws.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            
            if (data.type === 'host_ready') {
                status('📡 Хост найден, подключаемся...', '#ffaa00');
            }
            else if (data.type === 'offer') {
                await handleOffer(data.offer);
            }
            else if (data.type === 'ice') {
                if (pc) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
            else if (data.type === 'error') {
                status('❌ Комната ' + room + ' не найдена. Попросите хоста создать её', '#8b0000');
            }
        };

        ws.onerror = () => {
            status('❌ Ошибка сервера', '#8b0000');
        };
    };

    async function handleOffer(offer) {
        pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });

        pc.ontrack = (e) => {
            document.getElementById('remoteVideo').srcObject = e.streams[0];
            document.getElementById('videoArea').style.display = 'block';
            status('✅ ВИДЕО ПОЛУЧАЮ!', '#1a5f1a');
        };

        pc.onicecandidate = (e) => {
            if (e.candidate && ws) {
                ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, room: room }));
            }
        };

        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', answer: answer, room: room }));
    }

    document.getElementById('stopBtn').onclick = () => {
        if (pc) pc.close();
        if (ws) ws.close();
        document.getElementById('videoArea').style.display = 'none';
        status('📴 Отключено', '#333');
        location.reload();
    };
</script>
</body>
</html>
