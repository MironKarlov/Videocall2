<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер - смотреть друга</title>
    <style>
        body { font-family: system-ui; background: #0a0a0a; color: white; padding: 20px; text-align: center; }
        button { background: #3b82f6; padding: 15px 30px; font-size: 18px; border: none; border-radius: 50px; color: white; margin: 10px; width: 90%; }
        input { padding: 15px; font-size: 16px; border-radius: 50px; border: none; width: 90%; margin: 10px 0; text-align: center; background: #1a1a1a; color: white; }
        video { width: 100%; border-radius: 20px; margin-top: 10px; background: #111; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 20px; margin: 15px 0; }
        .green { background: #22c55e; color: black; }
    </style>
</head>
<body>

<h2>🎬 ПЛЕЕР — СМОТРЕТЬ ДРУГА</h2>

<div class="box">
    <p>🌐 <strong>IP ХОСТА (сказал друг)</strong></p>
    <input type="text" id="hostIp" placeholder="Введите IP хоста">
</div>

<div class="box">
    <p>🔢 <strong>НОМЕР КОМНАТЫ (которую создал хост)</strong></p>
    <input type="text" id="roomNumber" placeholder="Номер комнаты">
    <button id="connectBtn">🔗 ПОДКЛЮЧИТЬСЯ И СМОТРЕТЬ</button>
</div>

<div id="videoArea" style="display:none">
    <div class="box">
        <p>👤 <strong>ВИДЕО ДРУГА</strong></p>
        <video id="remoteVideo" autoplay playsinline></video>
        <button id="stopBtn" style="background:#dc2626">⏹️ ОТКЛЮЧИТЬСЯ</button>
    </div>
</div>

<div id="status" style="background:#333; padding:15px; border-radius:20px; margin-top:20px"></div>

<script>
    let pc = null;
    let hostIp = null;
    let room = null;

    function status(msg, color = '#ffaa00') {
        const div = document.getElementById('status');
        div.innerHTML = msg;
        div.style.background = color;
    }

    // ПОДКЛЮЧЕНИЕ
    document.getElementById('connectBtn').onclick = async () => {
        hostIp = document.getElementById('hostIp').value.trim();
        room = document.getElementById('roomNumber').value.trim();

        if (!hostIp) {
            status('❌ Введите IP хоста', '#8b0000');
            return;
        }
        if (!room) {
            status('❌ Введите номер комнаты', '#8b0000');
            return;
        }

        status('🔍 Ищем комнату ' + room + ' на IP ' + hostIp + '...', '#ffaa00');

        // Пытаемся получить offer из localStorage (через общий доступ - не работает между телефонами)
        // Поэтому используем ручной обмен
        
        // Для реальной работы нужно использовать сервер или прямой обмен
        // Показываем инструкцию
        status('⚠️ ДЛЯ ПОДКЛЮЧЕНИЯ: попросите хоста нажать "Создать комнату" и отправить вам код вручную', '#ffaa00');
        
        // Запрашиваем код у пользователя
        const offerCode = prompt('📥 Вставьте код, который дал хост (после создания комнаты):');
        
        if (!offerCode) {
            status('❌ Нет кода', '#8b0000');
            return;
        }

        status('🎥 Подключаемся...', '#ffaa00');

        pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.ontrack = (e) => {
            document.getElementById('remoteVideo').srcObject = e.streams[0];
            document.getElementById('videoArea').style.display = 'block';
            status('✅ ВИДЕО ПОЛУЧАЮ!', '#1a5f1a');
        };

        try {
            const offer = JSON.parse(offerCode);
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            // Отдаём ответ хосту
            const answerCode = JSON.stringify(answer);
            prompt('📤 Отправьте этот код ХОСТУ:', answerCode);
            
            status('✅ Код отправлен хосту, ожидаем видео...', '#1a5f1a');
        } catch(e) {
            status('❌ Неверный код', '#8b0000');
        }
    };

    document.getElementById('stopBtn').onclick = () => {
        if (pc) pc.close();
        document.getElementById('videoArea').style.display = 'none';
        status('📴 Отключено', '#333');
    };
</script>
</body>
</html>
