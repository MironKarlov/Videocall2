<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хост - создать комнату</title>
    <style>
        body { font-family: system-ui; background: #0a0a0a; color: white; padding: 20px; text-align: center; }
        button { background: #22c55e; padding: 15px 30px; font-size: 18px; border: none; border-radius: 50px; color: white; margin: 10px; width: 90%; }
        input { padding: 15px; font-size: 16px; border-radius: 50px; border: none; width: 90%; margin: 10px 0; text-align: center; background: #1a1a1a; color: white; }
        video { width: 100%; border-radius: 20px; margin-top: 10px; background: #111; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 20px; margin: 15px 0; }
        .green { background: #22c55e; color: black; }
        .status { padding: 15px; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<h2>📡 ХОСТ — СОЗДАТЬ КОМНАТУ</h2>

<div class="box">
    <p>🔢 <strong>НОМЕР КОМНАТЫ (придумайте)</strong></p>
    <input type="text" id="roomNumber" placeholder="Например: 123">
    <button id="createBtn">🏠 СОЗДАТЬ КОМНАТУ</button>
</div>

<div id="cameraArea" style="display:none">
    <div class="box">
        <p>🎥 <strong>ТРАНСЛЯЦИЯ ИДЁТ</strong></p>
        <video id="localVideo" autoplay playsinline muted></video>
        <button id="stopBtn" style="background:#dc2626">⏹️ ОСТАНОВИТЬ</button>
    </div>
</div>

<div id="status" class="status" style="background:#333"></div>

<script>
    let localStream = null;
    let pc = null;
    let ws = null;
    let room = null;

    function status(msg, color = '#ffaa00') {
        const div = document.getElementById('status');
        div.innerHTML = msg;
        div.style.background = color;
    }

    async function startCamera() {
        try {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('localVideo').srcObject = localStream;
            return true;
        } catch(e) {
            status('❌ Ошибка камеры: ' + e.message, '#8b0000');
            return false;
        }
    }

    document.getElementById('createBtn').onclick = async () => {
        room = document.getElementById('roomNumber').value.trim();
        if (!room) {
            status('❌ Введите номер комнаты', '#8b0000');
            return;
        }

        status('🎥 Включаем камеру...', '#ffaa00');
        const ok = await startCamera();
        if (!ok) return;

        // Подключаемся к серверу
        ws = new WebSocket('wss://webrtc-signaling-server-1.onrender.com');
        
        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'host', room: room }));
            status('✅ КОМНАТА ' + room + ' СОЗДАНА! Ждём друга...', '#1a5f1a');
        };

        ws.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            
            if (data.type === 'viewer_joined') {
                status('📞 ДРУГ ПОДКЛЮЧАЕТСЯ...', '#ffaa00');
                createOffer();
            }
            else if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                status('✅ ТРАНСЛЯЦИЯ ИДЁТ! Друг вас видит', '#1a5f1a');
            }
            else if (data.type === 'ice') {
                if (pc) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        };

        ws.onerror = () => {
            status('❌ Ошибка сервера. Попробуйте позже', '#8b0000');
        };
    };

    async function createOffer() {
        pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });

        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

        pc.onicecandidate = (e) => {
            if (e.candidate && ws) {
                ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, room: room }));
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', offer: offer, room: room }));
    }

    document.getElementById('stopBtn').onclick = () => {
        if (pc) pc.close();
        if (ws) ws.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('cameraArea').style.display = 'none';
        status('📴 Трансляция остановлена', '#333');
        location.reload();
    };
</script>
</body>
</html>
